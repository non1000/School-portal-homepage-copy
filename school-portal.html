<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="school-portal.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="logo-and-form">
      <div class="logo-and-creed">
        <div class="logo-and-title">
          <img src="Logo.png" alt="Afe Babalola University" />
          <div class="title">
            <p>Afe Babalola University</p>
            <h1>Integrated e-Portal</h1>
          </div>
        </div>
        <h1 class="goals">ACHEIVE YOUR GOALS:</h1>
        <div class="space">
          <h2>Labor Servitium Et Integritas</h2>
          <h2>Labour, Service and Integrity</h2>
        </div>
      </div>
      <div class="login">
        <form class="credentials" action="#">
          <p><b>Sign in</b></p>
          <input
            type="text"
            placeholder="Username"
            id="username"
            name="username"
          />
          <input
            type="password"
            placeholder="Password"
            id="password"
            name="password"
          />
          <div class="sign-in">
            <button>
              <a href="#">Sign in</a>
            </button>
            <a class="forgot-password" href="#">Forgot Password</a>
          </div>
        </form>
        <form class="lecturers" action="#">
          <button>
            <a href="#">Lecturers</a>
          </button>
        </form>
      </div>
    </div>
    <div class="nav-bar-and-copyright">
      <nav>
        <div class="current-page">
          <a href="#">Home</a>
        </div>
        <a href="#">Transcript</a>
        <a href="#">About</a>
        <a href="#">Calendar of events</a>
        <a href="#">Directories</a>
        <a href="#">Histories</a>
        <a href="#">Developers</a>
      </nav>
      <p>
        <b class="copyright"
          >Afe Babalola University Integrated ePortal Copyright 2025</b
        >
      </p>
    </div>
    <p class="status">Online</p>
  </body>
</html>
